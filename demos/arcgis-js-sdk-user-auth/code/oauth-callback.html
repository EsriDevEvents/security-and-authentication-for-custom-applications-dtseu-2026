<!-- 
 OAuth popup callback page from 
 https://github.com/Esri/jsapi-resources/blob/main/oauth/oauth-callback.html 
-->
<!doctype html>
<html>
  <head>
    <script>
      // #region handler
      function loadHandler() {
        // // windown.opener returns a reference to the window that opened the window, either with open(), or by navigating a link with a target attribute
        if (opener) {
          // check if ArcGIS returned an authorization_code in the url
          if (location.hash) {
            try {
              var esriId = opener.require("esri/kernel").id;
            } catch (e) {}
            if (esriId) {
              esriId.setOAuthResponseHash(location.hash);
            } else {
              opener.dispatchEvent(new CustomEvent("arcgis:auth:hash", { detail: location.hash }));
            }
          } else if (location.search) {
            opener.dispatchEvent(new CustomEvent("arcgis:auth:location:search", { detail: location.search }));
          }
        }
        close();
      }
      // #endregion
    </script>
  </head>
  <body onload="loadHandler();"></body>
</html>
